apiVersion: v1
kind: Service
metadata:
  name: {{ include "tiny-ci.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "tiny-ci.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "tiny-ci.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: server
